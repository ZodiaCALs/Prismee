<!doctype html>
<html lang="en" data-colors="us" data-wall="market" data-refract="on" data-insight="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Prism Market Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<style>
/* ===================== Tokens ===================== */
:root{
  color-scheme: light;
  --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  --base:#E4EBF4;
  --ink:#0E1726;
  --ink-2:rgb(14 23 38 / .66);
  --ink-3:rgb(14 23 38 / .46);
  --ink-4:rgb(14 23 38 / .22);
  --hair:rgb(14 23 38 / .08);
  --glass-rgb:250 252 255;
  --glass-a:.40;
  --glass-a-float:.30;
  --pop-a:.72;
  --rim-hi:rgb(255 255 255 / .95);
  --rim-lo:rgb(255 255 255 / .55);
  --rim-prism:linear-gradient(100deg, rgb(255 255 255/.95), rgb(120 205 255/.55) 22%, rgb(255 255 255/.15) 48%, rgb(255 150 215/.45) 76%, rgb(255 255 255/.85));
  --edge:rgb(14 23 38 / .07);
  --shadow:0 1px 2px rgb(20 32 64 / .05), 0 12px 32px -10px rgb(20 32 64 / .20);
  --shadow-float:0 2px 6px rgb(20 32 64 / .08), 0 18px 44px -12px rgb(20 32 64 / .32);
  --fill:rgb(14 23 38 / .05);
  --fill-2:rgb(14 23 38 / .09);
  --hover:rgb(255 255 255 / .42);
  --sel:rgb(255 255 255 / .74);
  --thumb:rgb(255 255 255 / .92);
  --sheen:.55;
  --flash:20%;
  --spec:rgb(255 255 255 / .55);
  --red:#E0374A;
  --green:#0A9C6A;
  --amber:#C4860F;
  --accent:#3B5BEA;
  --accent-ink:#fff;
  --grid:rgb(14 23 38 / .07);
  --ma1:#D3871A; --ma2:#2E7BDF; --ma3:#AE48D3; --ma4:#0F9EA3;
  --c-line:#2F66E8; --c-avg:#CF9214;
  --c-k:#2E7BDF; --c-d:#D3871A; --c-j:#AE48D3;
  --heat-0:#8E99AB;
  --w-a:#C9D8EE; --w-b:#E7D7F0; --w-c:#D4EBEA;
  --blur:26px;
  --blur-f:7px;
  --sat:175%;
  --r-xl:30px; --r-l:22px; --r-m:16px; --r-s:12px; --r-xs:9px;
  --spring:cubic-bezier(.3,1.32,.5,1);
  --ease:cubic-bezier(.22,.7,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme: dark;
    --base:#09111F;
    --ink:#EDF2FA;
    --ink-2:rgb(237 242 250 / .68);
    --ink-3:rgb(237 242 250 / .47);
    --ink-4:rgb(237 242 250 / .20);
    --hair:rgb(255 255 255 / .075);
    --glass-rgb:22 30 48;
    --glass-a:.40;
    --glass-a-float:.30;
    --pop-a:.76;
    --rim-hi:rgb(255 255 255 / .22);
    --rim-lo:rgb(255 255 255 / .075);
    --rim-prism:linear-gradient(100deg, rgb(255 255 255/.45), rgb(110 200 255/.36) 22%, rgb(255 255 255/.05) 48%, rgb(255 130 210/.30) 76%, rgb(255 255 255/.40));
    --edge:rgb(0 0 0 / .3);
    --shadow:0 1px 2px rgb(0 0 0 / .25), 0 16px 40px -12px rgb(0 0 0 / .55);
    --shadow-float:0 2px 6px rgb(0 0 0 / .3), 0 20px 50px -14px rgb(0 0 0 / .65);
    --fill:rgb(255 255 255 / .055);
    --fill-2:rgb(255 255 255 / .10);
    --hover:rgb(255 255 255 / .065);
    --sel:rgb(255 255 255 / .115);
    --thumb:rgb(255 255 255 / .17);
    --sheen:.16;
    --flash:30%;
    --spec:rgb(255 255 255 / .18);
    --red:#FF5468;
    --green:#22D08F;
    --amber:#F2B64C;
    --accent:#7F9DFF;
    --accent-ink:#0B1220;
    --grid:rgb(255 255 255 / .065);
    --ma1:#F0A93A; --ma2:#5FA8FF; --ma3:#D07BFF; --ma4:#3FD4D0;
    --c-line:#82B2FF; --c-avg:#F2BE4A;
    --c-k:#5FA8FF; --c-d:#F0A93A; --c-j:#D07BFF;
    --heat-0:#3A4559;
    --w-a:#14294A; --w-b:#2A1B45; --w-c:#0E3A44; }
}
:root[data-theme="dark"]{ color-scheme: dark;
    --base:#09111F;
    --ink:#EDF2FA;
    --ink-2:rgb(237 242 250 / .68);
    --ink-3:rgb(237 242 250 / .47);
    --ink-4:rgb(237 242 250 / .20);
    --hair:rgb(255 255 255 / .075);
    --glass-rgb:22 30 48;
    --glass-a:.40;
    --glass-a-float:.30;
    --pop-a:.76;
    --rim-hi:rgb(255 255 255 / .22);
    --rim-lo:rgb(255 255 255 / .075);
    --rim-prism:linear-gradient(100deg, rgb(255 255 255/.45), rgb(110 200 255/.36) 22%, rgb(255 255 255/.05) 48%, rgb(255 130 210/.30) 76%, rgb(255 255 255/.40));
    --edge:rgb(0 0 0 / .3);
    --shadow:0 1px 2px rgb(0 0 0 / .25), 0 16px 40px -12px rgb(0 0 0 / .55);
    --shadow-float:0 2px 6px rgb(0 0 0 / .3), 0 20px 50px -14px rgb(0 0 0 / .65);
    --fill:rgb(255 255 255 / .055);
    --fill-2:rgb(255 255 255 / .10);
    --hover:rgb(255 255 255 / .065);
    --sel:rgb(255 255 255 / .115);
    --thumb:rgb(255 255 255 / .17);
    --sheen:.16;
    --flash:30%;
    --spec:rgb(255 255 255 / .18);
    --red:#FF5468;
    --green:#22D08F;
    --amber:#F2B64C;
    --accent:#7F9DFF;
    --accent-ink:#0B1220;
    --grid:rgb(255 255 255 / .065);
    --ma1:#F0A93A; --ma2:#5FA8FF; --ma3:#D07BFF; --ma4:#3FD4D0;
    --c-line:#82B2FF; --c-avg:#F2BE4A;
    --c-k:#5FA8FF; --c-d:#F0A93A; --c-j:#D07BFF;
    --heat-0:#3A4559;
    --w-a:#14294A; --w-b:#2A1B45; --w-c:#0E3A44; }

html[data-colors="cn"]{ --up:var(--red); --down:var(--green); }
html[data-colors="us"]{ --up:var(--green); --down:var(--red); }

/* ===================== Base ===================== */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;height:100%;background:var(--base);color:var(--ink);font:500 14px/1.45 var(--font);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p,dl,dd,figure{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.up{color:var(--up)} .dn{color:var(--down)} .flat{color:var(--ink-2)}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ===================== Wallpaper ===================== */
.wall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--base)}
.wall canvas{position:absolute;left:-70px;top:-70px;width:calc(100% + 140px);height:calc(100% + 140px);filter:blur(18px) saturate(1.25);opacity:0;transition:opacity .8s var(--ease)}
html[data-wall="market"] .wall canvas.on{opacity:1}
.wl{position:absolute;inset:-12%;opacity:0;transition:opacity .8s var(--ease)}
html[data-wall="prism"] .wl-prism,html[data-wall="ocean"] .wl-ocean,html[data-wall="graphite"] .wl-graphite{opacity:1}
.wl-prism{background:
  linear-gradient(118deg, transparent 34%, rgb(92 225 230/.55) 41%, rgb(124 140 255/.55) 48%, rgb(236 112 200/.50) 55%, rgb(246 183 92/.45) 62%, transparent 70%),
  radial-gradient(42% 36% at 14% 12%, rgb(255 255 255/.85), transparent 70%),
  radial-gradient(60% 50% at 88% 86%, var(--w-b), transparent 72%),
  radial-gradient(55% 55% at 80% 12%, var(--w-a), transparent 70%),
  var(--base);filter:blur(34px)}
.wl-ocean{background:radial-gradient(60% 60% at 20% 20%, var(--w-c), transparent 70%),radial-gradient(70% 60% at 85% 75%, var(--w-a), transparent 72%),linear-gradient(160deg, var(--base), var(--w-a));filter:blur(30px)}
.wl-graphite{background:radial-gradient(70% 60% at 30% 10%, rgb(255 255 255/.5), transparent 70%),linear-gradient(170deg, var(--base), color-mix(in srgb, var(--base) 82%, #7a8494))}
html[data-ambient="on"] .wl-prism{animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate3d(-3%,-2%,0) rotate(-2deg)}100%{transform:translate3d(3%,2%,0) rotate(2deg)}}
.wall-grain{position:absolute;inset:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

/* ===================== Glass materials ===================== */
.panel{position:relative;isolation:isolate;border-radius:var(--r-xl);
  background:rgb(var(--glass-rgb) / calc(var(--glass-a) * var(--tint,1)));
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  box-shadow:var(--shadow), inset 0 0 0 1px var(--rim-lo), inset 0 1px 0 var(--rim-hi);
}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(165deg, rgb(255 255 255 / calc(var(--sheen) * .55)) 0%, transparent 34%)}
.panel::after,.liquid::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .45s var(--ease);
  background:radial-gradient(320px circle at var(--mx,50%) var(--my,0%), var(--spec), transparent 62%)}
.panel[data-lit]::after,.liquid[data-lit]::after{opacity:.38}

.liquid{position:relative;isolation:isolate;
  background:rgb(var(--glass-rgb) / calc(var(--glass-a-float) * var(--tint,1)));
  box-shadow:var(--shadow-float), inset 0 1px 0 var(--rim-hi), inset 0 -1px 1px rgb(255 255 255/.10)}
.liquid>.lg{position:absolute;inset:0;z-index:-2;border-radius:inherit;pointer-events:none;
  -webkit-backdrop-filter:blur(var(--blur-f)) saturate(190%) brightness(1.05);backdrop-filter:blur(var(--blur-f)) saturate(190%) brightness(1.05)}
html.can-refract[data-refract="on"] .liquid>.lg{filter:var(--lg-filter,none);clip-path:inset(0 round var(--lg-r,999px))}
.liquid::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:-1;background:var(--rim-prism);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.pop{--glass-a-float:var(--pop-a)}

/* ===================== App shell ===================== */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);padding:14px 16px 16px;gap:0}
.topbar{display:flex;align-items:center;gap:14px;height:58px;padding:0 10px 0 16px;border-radius:999px;margin-bottom:10px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:750;font-size:17px;letter-spacing:-.01em;flex:none}
.brand svg{width:26px;height:26px}
.brand small{font-weight:600;color:var(--ink-3);font-size:12.5px;margin-left:-2px}
.top-spacer{flex:1}
.search{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 14px;border-radius:999px;background:var(--fill);box-shadow:inset 0 0 0 .5px var(--edge);width:min(380px,32vw);transition:background .2s, box-shadow .2s}
.search:focus-within{background:var(--sel);box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:100%;font-weight:600;font-size:14px}
.search input::placeholder{color:var(--ink-3);font-weight:500}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{font:600 11px/1 var(--font);color:var(--ink-3);border:1px solid var(--ink-4);border-radius:6px;padding:3px 6px}
.search svg{color:var(--ink-3)}
.top-actions{display:flex;align-items:center;gap:4px;flex:none}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:var(--ink-2);transition:background .2s,color .2s,scale .25s var(--spring)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn:active{scale:.9}
.lang-btn{font-weight:750;font-size:14px}
.feed-pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 13px 0 11px;border-radius:999px;font-weight:650;font-size:12.5px;color:var(--ink-2);background:var(--fill);margin-right:4px;transition:background .2s}
.feed-pill:hover{background:var(--hover)}
.feed-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-4);position:relative}
.feed-pill[aria-pressed="true"] .feed-dot{background:var(--up)}
.feed-pill[aria-pressed="true"] .feed-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--up);opacity:0;animation:ping 2.2s var(--ease) infinite}
@keyframes ping{0%{opacity:.7;scale:.5}100%{opacity:0;scale:1.5}}

/* segmented control with liquid thumb */
.seg{position:relative;display:inline-flex;align-items:center;padding:3px;border-radius:999px;background:var(--fill);box-shadow:inset 0 0 0 .5px var(--edge);flex:none;max-width:100%}
.seg>button{position:relative;z-index:1;height:32px;padding:0 14px;border-radius:999px;color:var(--ink-2);font-weight:650;font-size:13px;white-space:nowrap;transition:color .25s}
.seg>button:hover{color:var(--ink)}
.seg>button[aria-pressed="true"],.seg>button[aria-selected="true"]{color:var(--ink)}
.seg-thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:var(--thumb);pointer-events:none;
  box-shadow:0 1px 2px rgb(0 0 0/.08),0 4px 14px -4px rgb(0 0 0/.18),inset 0 1px 0 var(--rim-hi),inset 0 0 0 .5px var(--rim-lo);
  transition:translate .48s var(--spring),width .48s var(--spring),opacity .2s}
.seg-thumb.go{animation:squish .5s var(--ease)}
@keyframes squish{0%{scale:1 1}35%{scale:1.1 .9}100%{scale:1 1}}
.seg.sm>button{height:26px;padding:0 10px;font-size:12px}
.seg-main>button{height:36px;padding:0 18px;font-size:14px}
.seg-main{padding:4px}
.seg-main .seg-thumb{top:4px;bottom:4px}

/* ticker */
.ticker{height:40px;border-radius:999px;margin-bottom:12px;display:flex;align-items:center;overflow:hidden;padding:0 6px}
.ticker-track{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;width:100%;height:100%;align-items:center;scroll-snap-type:x proximity;-webkit-mask:linear-gradient(90deg,#000 calc(100% - 56px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 56px),transparent)}
.ticker-track::-webkit-scrollbar{display:none}
.tk{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border-radius:999px;white-space:nowrap;font-size:13px;transition:background .2s;scroll-snap-align:start}
.tk:hover{background:var(--hover)}
.tk b{font-weight:650;color:var(--ink-2)}
.tk .px{font-weight:700}
.tk .pc{font-weight:700;font-size:12.5px}

/* views */
.views{min-height:0;position:relative}
.views{grid-row:3}
.view{height:100%;min-height:0}
.view-watch,.view-funds{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
.center{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:14px;min-height:0}
.list-panel,.detail-panel,.side-panel{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--ink-4) transparent}
.view-markets{overflow:auto;overscroll-behavior:contain;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--ink-4) transparent}
html[data-insight="off"] .center{grid-template-columns:minmax(0,1fr)}
html[data-insight="off"] #stockSide,html[data-insight="off"] #fundSide{display:none}

/* ===================== List panel ===================== */
.lp-head{position:sticky;top:0;z-index:3;padding:16px 16px 12px;display:grid;gap:12px;border-radius:var(--r-xl) var(--r-xl) 0 0;
  background:rgb(var(--glass-rgb)/.42);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);box-shadow:0 1px 0 var(--hair)}
.lp-title{display:flex;align-items:center;gap:8px}
.lp-title h2{font-size:19px;font-weight:750;letter-spacing:-.015em;flex:1}
.lp-title .count{font-size:12.5px;color:var(--ink-3);font-weight:650}
.txt-btn{height:30px;padding:0 12px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--accent);white-space:nowrap;transition:background .2s}
.txt-btn.on{background:var(--fill-2)}
.txt-btn:hover{background:var(--hover)}
.lp-head .seg{width:100%}
.lp-head .seg>button{flex:1;padding:0 6px}
.rows{padding:2px 8px 12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 62px auto;align-items:center;gap:10px;padding:10px 10px;border-radius:var(--r-m);cursor:pointer;position:relative;transition:background .2s}
.row:hover{background:var(--hover)}
.row[aria-current="true"]{background:var(--sel);box-shadow:inset 0 1px 0 var(--rim-hi),0 1px 3px rgb(0 0 0/.06)}
.row-name{min-width:0}
.row-name b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-name small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-weight:600;margin-top:1px;white-space:nowrap}
.mk{display:inline-grid;place-items:center;height:16px;min-width:22px;padding:0 4px;border-radius:5px;font:700 9.5px/1 var(--font);letter-spacing:.02em;color:#fff;background:#6B7A90}
.mk-US{background:#4C6FE0}.mk-SH{background:#D2563B}.mk-SZ{background:#C9792B}.mk-HK{background:#7A55C9}.mk-F{background:#2C9A8E}
.row-spark svg{display:block;width:62px;height:28px}
.spark-line{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark-base{stroke:var(--ink-4);stroke-width:1;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
.row-px{display:grid;justify-items:end;gap:3px;min-width:76px}
.row-px b{font-weight:700;font-size:14px;padding:0 3px;border-radius:6px}
.pchip{display:inline-block;min-width:68px;padding:2px 7px;border-radius:7px;text-align:right;font-weight:750;font-size:12px;color:#fff;background:var(--ink-4)}
.pchip.up{background:var(--up);color:#fff}.pchip.dn{background:var(--down);color:#fff}
.row-x{display:none;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--ink-3)}
.row-x:hover{color:var(--ink);background:var(--hover)}
.row-x[aria-pressed="true"]{color:var(--amber)}
.row-x[aria-pressed="true"] svg{fill:currentColor}
.rows.market .row{grid-template-columns:minmax(0,1fr) 62px auto 28px}
.rows.market .row-x{display:grid}
.rows.editing .row{grid-template-columns:28px minmax(0,1fr) auto 28px;cursor:default}
.rows.editing .row-spark{display:none}
.row-del{display:none;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff}
.row-del svg{width:14px;height:14px;stroke-width:2.6}
.row-grip{display:none;place-items:center;width:28px;height:32px;color:var(--ink-3);cursor:grab;touch-action:none}
.rows.editing .row-del,.rows.editing .row-grip{display:grid}
.row.dragging{background:var(--sel);box-shadow:0 10px 30px -8px rgb(0 0 0/.35);z-index:5;scale:1.02;cursor:grabbing}
.row .bell-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block}
html[data-compact="on"] .row{padding:6px 10px}
html[data-compact="on"] .row-spark svg{height:22px}
.empty{padding:28px 18px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.55}
.empty b{display:block;color:var(--ink-2);font-size:14px;margin-bottom:4px}
.fu1{animation:flu .75s var(--ease)}.fu2{animation:flu2 .75s var(--ease)}
.fd1{animation:fld .75s var(--ease)}.fd2{animation:fld2 .75s var(--ease)}
@keyframes flu{0%{background:color-mix(in srgb, var(--up) var(--flash), transparent)}100%{background:transparent}}

/* ===================== Detail panel ===================== */
.detail-panel{padding:22px 24px 24px}

.sd-quote{display:flex;align-items:flex-end;flex-wrap:wrap;gap:4px 18px;margin:16px 0 4px}
.big{font-size:52px;line-height:.95;font-weight:250;letter-spacing:-.035em;padding:0 4px;margin-left:-4px;border-radius:10px}
.big-chg{display:flex;gap:10px;font-size:18px;font-weight:700;padding-bottom:5px}
.sd-time{width:100%;font-size:12px;color:var(--ink-3);font-weight:600;margin-top:6px}
.ranges{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;margin:18px 0 6px}
.rng{display:grid;gap:6px}
.rng-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);font-weight:650}

.rng-track{position:relative;height:6px;border-radius:3px;background:var(--fill-2)}
.rng-fill{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg, var(--down), var(--ink-4) 50%, var(--up));opacity:.75}
.rng-knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgb(0 0 0/.3),inset 0 0 0 1px rgb(0 0 0/.06);transition:left .5s var(--ease)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 22px;margin:14px 0 18px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair)}
.stat dt{color:var(--ink-3);font-size:12.5px;font-weight:600;white-space:nowrap}
.stat dd{font-weight:700;font-size:13.5px;white-space:nowrap}

.chart-card{position:relative;border-radius:var(--r-l);background:rgb(var(--glass-rgb)/.30);box-shadow:inset 0 0 0 1px var(--hair),inset 0 1px 0 var(--rim-lo);padding:12px 12px 8px}
.chart-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:10px}

.chart-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chart-sub{display:flex;align-items:center;gap:8px;padding:0 0 4px}
.chart-info{flex:1;display:flex;flex-wrap:wrap;gap:4px 14px;min-height:20px;font-size:12px;font-weight:650;color:var(--ink-3);padding:0 4px}
.chart-acts{display:flex;gap:0;flex:none;margin-right:-4px}
.chart-acts .icon-btn{width:34px;height:34px}

.chart-host{position:relative;height:clamp(330px, 52vh, 560px);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart-host canvas{position:absolute;inset:0;display:block;cursor:crosshair}
.kc-dot{position:absolute;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--c-line);pointer-events:none;display:none}
.kc-dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid currentColor;opacity:0;animation:ping 1.8s var(--ease) infinite}
.chart-card.expanded{position:fixed;z-index:60;inset:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;
  background:rgb(var(--glass-rgb)/.93);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);box-shadow:var(--shadow-float),inset 0 0 0 1px var(--rim-lo)}

.profile{display:grid;grid-template-columns:1fr;gap:0;margin:0}
.profile .stat dd{white-space:normal;text-align:right}

/* ===================== Side panel ===================== */
.side-panel{padding:16px 18px 20px}
.side-panel .seg{width:100%;margin-bottom:16px}
.side-panel .seg>button{flex:1}
.sec{margin-bottom:22px}

.ladder .lv b{order:2;font-weight:750}

.ladder .lv.now::before{border-top:1.5px solid var(--ink-2)}

.summary{font-size:13.5px;line-height:1.62;color:var(--ink-2);font-weight:500;max-width:64ch}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin-top:10px}
.ai-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;border-radius:999px;font-weight:750;font-size:13.5px;color:var(--ink);transition:scale .3s var(--spring)}
.ai-btn:active{scale:.97}
.ai-btn svg{color:var(--accent)}

.ai-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.book{display:grid;gap:1px}
.bk{position:relative;display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;height:26px;padding:0 10px;font-size:12.5px;font-weight:650;border-radius:7px;overflow:hidden}

.bk>*{position:relative;z-index:1}
.bk span{color:var(--ink-3)}
.bk.ask i{background:var(--down)}.bk.bid i{background:var(--up)}
.bk-mid{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;margin:4px 0;border-radius:10px;background:var(--fill);font-weight:700;font-size:13px}
.bk-sum{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);font-weight:650;margin-bottom:8px}
.trades{display:grid;gap:0;font-size:12.5px;font-weight:650}
.tr{display:grid;grid-template-columns:76px 1fr 1fr 22px;gap:8px;padding:5px 10px;border-bottom:1px solid var(--hair)}

.breadth{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0 6px;background:var(--fill-2)}
.breadth i{display:block;height:100%}
.mini-list .mrow{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--hair);font-size:13px;cursor:pointer}
.mini-list .mrow:hover b{color:var(--accent)}
.mini-list .mrow b{font-weight:700;transition:color .2s}

/* ===================== Markets view ===================== */
.mk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}

.ix b{font-weight:700;font-size:13.5px;display:block}

.heat-card{padding:18px}
.card-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.card-head h2{font-size:18px;font-weight:750;letter-spacing:-.015em;flex:1}
.card-sub{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-bottom:12px}
.heat{position:relative;height:clamp(320px, 46vh, 520px);border-radius:var(--r-m);overflow:hidden}
.tile{position:absolute;padding:8px 9px;border-radius:10px;overflow:hidden;cursor:pointer;color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:inset 0 1px 0 rgb(255 255 255/.28),inset 0 0 0 .5px rgb(255 255 255/.18);transition:filter .2s,background-color .6s var(--ease);text-shadow:0 1px 2px rgb(0 0 0/.25)}

.tile span{font-size:12px;font-weight:750;opacity:.95}
.tile small{display:block;font-size:11px;font-weight:650;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

.heat-legend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--ink-3);font-weight:650}

.movers-card{padding:18px}
.mv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border-radius:var(--r-s);cursor:pointer;transition:background .2s}
.mv:hover{background:var(--hover)}
.mv b{display:block;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv small{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);font-weight:600}

/* ===================== Funds ===================== */
.fl-filters{display:grid;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:28px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--fill);transition:background .2s,color .2s}
.chip:hover{color:var(--ink)}

.tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10.5px;font-weight:750;background:var(--fill-2);color:var(--ink-2)}

.fnum>span{display:block;font-size:12px;color:var(--ink-3);font-weight:650;margin-bottom:4px}
.fnum b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.fnum small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
.fnum.hero b{font-size:30px;font-weight:300}
.perf{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.perf th,.perf td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--hair);white-space:nowrap}
.perf th{font-size:12px;color:var(--ink-3);font-weight:650}
.perf th:first-child,.perf td:first-child{text-align:left;color:var(--ink-2);font-weight:650}
.perf td{font-weight:700}
.table-wrap{overflow-x:auto}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;margin-top:22px}
.hold{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:4px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--hair);font-size:13px}

.hold b.link:hover{color:var(--accent)}
.hold em{font-style:normal;text-align:right;font-weight:700}
.hold i{grid-column:1/3;height:4px;border-radius:2px;background:var(--fill-2);overflow:hidden}
.hold i::after{content:"";display:block;height:100%;width:var(--w);border-radius:2px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 50%, #b071ff))}
.alloc{display:flex;align-items:center;gap:18px}

.mcell span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:650}

.dca{padding:16px;border-radius:var(--r-l);background:var(--fill)}

.field>span{font-size:12px;color:var(--ink-3);font-weight:650}
.num-in{height:40px;border-radius:12px;border:0;background:var(--sel);box-shadow:inset 0 0 0 1px var(--hair);padding:0 12px;font-weight:700;font-size:15px;width:100%;outline:0}

.dca-chart svg{width:100%;height:110px;display:block}

/* ===================== Tab bar (mobile) ===================== */
.tabbar{display:none}

/* ===================== Sheet, popover, toasts ===================== */

.scrim.on{opacity:1}
.sheet{position:fixed;z-index:71;top:calc(14px + env(safe-area-inset-top,0px));right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 28px));border-radius:var(--r-xl);
  display:flex;flex-direction:column;translate:calc(100% + 24px) 0;transition:translate .5s var(--spring)}
.sheet.on{translate:0 0}
.sheet-head{display:flex;align-items:center;gap:10px;padding:18px 18px 10px 22px}
.sheet-head h2{flex:1;font-size:21px;font-weight:750;letter-spacing:-.02em}

.sgroup{margin:16px 0 6px}

.scard{border-radius:var(--r-l);background:rgb(var(--glass-rgb)/.45);box-shadow:inset 0 0 0 1px var(--hair);padding:4px 14px}
.srow{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0;border-bottom:1px solid var(--hair)}
.srow:last-child{border-bottom:0}
.srow>label,.srow>.lab{flex:1;font-weight:650;font-size:14px}
.srow .lab small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px;line-height:1.35}
.srow.col{flex-direction:column;align-items:stretch;gap:8px}
.srow .seg>button{padding:0 11px}
.switch{position:relative;width:50px;height:30px;border-radius:999px;background:var(--fill-2);flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 2px 6px rgb(0 0 0/.22),0 0 0 .5px rgb(0 0 0/.04);transition:translate .38s var(--spring),width .25s var(--ease)}
.switch:active::after{width:32px}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{translate:20px 0}
.switch[aria-checked="true"]:active::after{translate:14px 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--fill-2) var(--p,50%))}

input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--fill-2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgb(0 0 0/.25)}
.swatches{display:flex;gap:10px}
.sw{display:grid;gap:6px;justify-items:center;font-size:11.5px;font-weight:650;color:var(--ink-3)}
.sw i{display:block;width:56px;height:40px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hair);transition:scale .3s var(--spring)}
.sw[aria-pressed="true"]{color:var(--ink)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--base),0 0 0 4px var(--accent)}
.sw:active i{scale:.92}
.ma-ins{display:flex;gap:8px}
.ma-ins input{width:58px;height:34px;border-radius:10px;border:0;background:var(--sel);box-shadow:inset 0 0 0 1px var(--hair);text-align:center;font-weight:700;outline:0}
.ma-ins input:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.ghost-btn{height:36px;padding:0 14px;border-radius:999px;background:var(--fill);font-weight:700;font-size:13px;transition:background .2s}
.ghost-btn:hover{background:var(--hover)}
.ghost-btn.danger{color:var(--red)}
.about{font-size:12.5px;color:var(--ink-3);line-height:1.6;font-weight:500;padding:10px 0}
.save-state{font-size:11.5px;color:var(--ink-3);font-weight:650;padding:0 22px 14px}

.search-pop{position:absolute;top:calc(100% + 10px);left:-10px;right:-10px;min-width:340px;border-radius:var(--r-l);padding:8px;max-height:min(460px,70vh);overflow:auto;z-index:40}
.sr-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto 30px;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--r-s);cursor:pointer}
.sr-item[aria-selected="true"],.sr-item:hover{background:var(--hover)}
.sr-item b{display:block;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-item small{font-size:11.5px;color:var(--ink-3);font-weight:650}
.sr-item .vals{text-align:right;font-size:12.5px;font-weight:700}
.sr-empty{padding:16px;color:var(--ink-3);font-size:13px;text-align:center}
.popover{position:fixed;z-index:65;width:300px;border-radius:var(--r-l);padding:16px}
.popover h4{font-size:15px;font-weight:750;margin-bottom:4px}
.popover p{font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:12px}
.pop-row{display:flex;gap:8px}
.pop-row .num-in{flex:1}
.solid-btn{height:40px;padding:0 16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:750;font-size:13.5px;transition:scale .3s var(--spring),filter .2s;white-space:nowrap}
.solid-btn:hover{filter:brightness(1.08)}
.solid-btn:active{scale:.95}
.alert-list{margin-top:12px;display:grid;gap:4px}
.al{display:flex;align-items:center;gap:8px;padding:6px 4px 6px 10px;border-radius:10px;background:var(--fill);font-size:13px;font-weight:650}
.al span{flex:1}
.toasts{position:fixed;z-index:80;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;justify-items:end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:360px;padding:12px 16px;border-radius:18px;font-size:13.5px;font-weight:650;animation:tin .5s var(--spring)}
.toast .tdot{width:8px;height:8px;border-radius:50%;flex:none}
.toast.out{animation:tout .35s var(--ease) forwards}
@keyframes tin{from{translate:0 16px;opacity:0;scale:.96}to{translate:0 0;opacity:1;scale:1}}
@keyframes tout{to{translate:0 10px;opacity:0}}

/* ===================== Boot: glass condenses once ===================== */
.booting .panel{opacity:0;translate:0 10px;-webkit-backdrop-filter:blur(0px) saturate(100%);backdrop-filter:blur(0px) saturate(100%)}
.booting .topbar{translate:0 -12px}
.panel{transition:opacity .7s var(--ease),translate .7s var(--ease),-webkit-backdrop-filter .9s var(--ease),backdrop-filter .9s var(--ease)}
.topbar{transition:translate .7s var(--spring)}

/* ===================== Responsive ===================== */
@media (max-width:1279px){
  .center{display:block;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}

  .topbar .seg-main,.feed-pill span,#themeBtn,#langBtn,#settingsBtn,.top-spacer{display:none}

  .ticker{margin-bottom:10px}
  .view,.view-watch,.view-funds{display:block;height:auto}
  .center{display:block;overflow:visible}
  .list-panel,.detail-panel,.side-panel{overflow:visible}
  .lp-head{position:static;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
  .view.show-detail .list-panel{display:none}
  .view:not(.show-detail) .center{display:none}
  .back-btn{display:inline-flex}
  .panel{border-radius:26px}
  .detail-panel{padding:16px 16px 18px}
  .big{font-size:44px}
  .ranges{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr;gap:0 16px}
  .chart-card{padding:10px 8px 6px;margin:0 -6px}
  .chart-host{height:340px}
  .two{grid-template-columns:1fr}
  .mk-grid{grid-template-columns:1fr}
  .heat{height:420px}
  .tabbar{display:flex;position:fixed;z-index:50;left:50%;translate:-50% 0;bottom:0;margin-bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 24px));height:64px;border-radius:999px;padding:5px;gap:2px}
  .tabbar>button{position:relative;z-index:1;flex:1;display:grid;justify-items:center;align-content:center;gap:2px;border-radius:999px;font-size:10.5px;font-weight:750;color:var(--ink-2);transition:color .25s}
  .tabbar>button svg{width:22px;height:22px}
  .tabbar>button[aria-selected="true"]{color:var(--accent)}
  .tabbar .seg-thumb{top:5px;bottom:5px}
  .toasts{left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));justify-items:center}
  .sheet{top:auto;left:8px;right:8px;width:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:88%;translate:0 calc(100% + 30px)}
  .popover{left:12px!important;right:12px;width:auto}
}
@media (max-width:420px){

  .stat dt{font-size:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

const DAY = 86400000;

}

const pad2 = n => String(n).padStart(2,'0');
const hhmm = min => pad2(Math.floor(min/60)%24)+':'+pad2(Math.floor(min%60));
function minToIdx(m, t){ let acc=0; for (const [a,b] of MKT[m].segs){ if (t<a) return acc; if (t<=b) return acc+(t-a); acc+=b-a; } return acc; }

  const M = MKT[m], z = zoned(M.tz), t = z.min, wd = z.wd, wk = wd>=1 && wd<=5, first = M.segs[0][0];

/* ===================== Simulated history ===================== */

function genIntraday(R, bar, pc, sd, len, k, lim, vday){

function storeQuote(u, g){
  const b = g.bars, n = b.length, last = b[n-1];
  let cpv = 0, cv = 0; for (const p of g.pts){ cpv += p.p*p.v; cv += p.v; }
  last.v = Math.round(cv);
  HIST[u.s] = {bars:b, pts:g.pts, cpv, cv};
  let hi=-Infinity, lo=Infinity; for (let i=Math.max(0,n-252); i<n; i++){ if (b[i].h>hi) hi=b[i].h; if (b[i].l<lo) lo=b[i].l; }
  Q[u.s] = {u, price:last.c, pc:b[n-2].c, open:last.o, high:last.h, low:last.l, vol:cv, amt:cpv, hi52:hi, lo52:lo, dir:0, t:Date.now()};
}
function roundFund(f, x){ return f.kind==='etf' ? (x<10 ? Math.round(x*1000)/1000 : Math.round(x*100)/100) : Math.round(x*10000)/10000; }
function buildFund(f){
  const R = makeRng(hashStr('F:'+f.id));
  let dates, rb = null;
  if (f.bench){ const bb = HIST[f.bench].bars; dates = bb.map(b=>b.t); rb = bb.map((b,i)=> i ? Math.log(b.c/bb[i-1].c) : 0); }
  else dates = tradingDates(f.m, N_DAYS);
  const n = dates.length, sdI = f.idio/Math.sqrt(252), a = (f.alpha||0)/252, lv = new Float64Array(n);
  let acc = 0, idio = 0;
  for (let i=1;i<n;i++){ const e = sdI*R.n(), base = f.bench ? f.beta*rb[i] : (f.drift||0)/252; acc += base + a + e; lv[i] = acc; if (i===n-1) idio = a + e + (f.bench ? 0 : base); }
  const div = f.kind==='mf' ? Math.round(R.u()*(2026 - +f.inc.slice(0,4))*40)/1000 : 0;
  if (f.kind==='etf'){
    const k = f.ref/Math.exp(lv[n-1]);
    const vals = Array.from(lv, x => roundFund(f, Math.exp(x)*k));
    FH[f.id] = {dates, vals};
    FQ[f.id] = {price:vals[n-1], pc:vals[n-2], idio, t:Date.now()};
  } else {
    const k = f.ref/Math.exp(lv[n-2]);
    const vals = Array.from(lv.slice(0,n-1), x => roundFund(f, Math.exp(x)*k));
    FH[f.id] = {dates:dates.slice(0,n-1), vals};
    const nav = vals[n-2];
    FQ[f.id] = {nav, pc:vals[n-3], est:nav*Math.exp(lv[n-1]-lv[n-2]), idio, estDate:dates[n-1], accum:+(nav+div).toFixed(4), t:Date.now()};
  }
}
function buildAll(){
  for (const m of ['US','CN','HK']){
    const dates = tradingDates(m, N_DAYS);
    const main = U.find(u=>u.m===m && u.kind==='index' && u.main);
    const g = genSeries(main, dates, null, 0); storeQuote(main, g);
    for (const u of U) if (u.m===m && u!==main) storeQuote(u, genSeries(u, dates, g.z, u.kind==='index' ? .88 : (u.rho||.58)));
  }
  for (const f of FUNDS) buildFund(f);
}

/* ===================== Live ticks ===================== */
const SPEEDS = {slow:{ms:2600,k:.035}, normal:{ms:1600,k:.05}, fast:{ms:900,k:.075}};
function tickQuote(u, fm, k){
  const q = Q[u.s], H = HIST[u.s], sdT = u.vol/Math.sqrt(252)*k;
  const rho = u.kind==='index' ? (u.main ? 1 : .88) : (u.rho||.58);
  const e = rho*fm + Math.sqrt(Math.max(0,1-rho*rho))*LIVE.n();
  let p = Math.exp(Math.log(q.price) + sdT*e - .0025*Math.log(q.price/q.pc));
  const lim = limitPct(u); if (lim) p = clamp(p, q.pc*(1-lim), q.pc*(1+lim));
  p = roundPrice(u, p);
  if (p === q.price) return false;
  q.dir = p > q.price ? 1 : -1; q.price = p;
  if (p > q.high) q.high = p; if (p < q.low) q.low = p;
  if (p > q.hi52) q.hi52 = p; if (p < q.lo52) q.lo52 = p;
  const dv = q.vol/Math.max(60, H.pts.length)*(.25+LIVE.u())*.08;
  q.vol += dv; q.amt += dv*p; q.t = Date.now();
  const b = H.bars[H.bars.length-1]; b.c = p; b.h = q.high; b.l = q.low; b.v = q.vol;
  const lp = H.pts[H.pts.length-1]; lp.p = p; H.cpv += p*dv; H.cv += dv; lp.a = H.cpv/H.cv;
  return true;
}
function tickFund(f, k){
  const st = FQ[f.id], sdI = f.idio/Math.sqrt(252);
  st.idio += sdI*k*.6*LIVE.n() - .003*st.idio;
  const r = (f.bench ? f.beta*Math.log(Q[f.bench].price/Q[f.bench].pc) : 0) + st.idio;
  if (f.kind==='etf'){ const p = roundFund(f, st.pc*Math.exp(r)); if (p===st.price) return false; st.dir = p>st.price?1:-1; st.price = p; const v = FH[f.id].vals; v[v.length-1] = p; }
  else { const e = st.nav*Math.exp(r); st.dir = e>st.est?1:-1; st.est = e; }
  st.t = Date.now();
  return true;
}
function fundNow(f){ const st = FQ[f.id]; return f.kind==='etf' ? st.price : st.est; }
function fundBase(f){ const st = FQ[f.id]; return f.kind==='etf' ? st.pc : st.nav; }
function fundDay(f){ return fundNow(f)/fundBase(f) - 1; }

/* ===================== Indicators ===================== */
function sma(a, n){ const o = new Array(a.length).fill(null); let s=0; for (let i=0;i<a.length;i++){ s+=a[i]; if (i>=n) s-=a[i-n]; if (i>=n-1) o[i]=s/n; } return o; }
function ema(a, n){ const o = new Array(a.length); const k = 2/(n+1); let e = a[0]; for (let i=0;i<a.length;i++){ e = i ? a[i]*k + e*(1-k) : a[0]; o[i]=e; } return o; }
function macdOf(c){ const e12=ema(c,12), e26=ema(c,26), dif=c.map((_,i)=>e12[i]-e26[i]), dea=ema(dif,9); return {dif, dea, hist:dif.map((d,i)=>2*(d-dea[i]))}; }
function rsiOf(c, n){
  const o = new Array(c.length).fill(null); if (c.length<=n) return o;
  let g=0, l=0; for (let i=1;i<=n;i++){ const d=c[i]-c[i-1]; if (d>0) g+=d; else l-=d; } g/=n; l/=n;
  o[n] = l===0 ? 100 : 100-100/(1+g/l);
  for (let i=n+1;i<c.length;i++){ const d=c[i]-c[i-1]; g=(g*(n-1)+Math.max(d,0))/n; l=(l*(n-1)+Math.max(-d,0))/n; o[i] = l===0 ? 100 : 100-100/(1+g/l); }
  return o;
}
function kdjOf(b, n=9){
  const K=[], D=[], J=[]; let k=50, d=50;
  for (let i=0;i<b.length;i++){ let hh=-Infinity, ll=Infinity; for (let j=Math.max(0,i-n+1); j<=i; j++){ if (b[j].h>hh) hh=b[j].h; if (b[j].l<ll) ll=b[j].l; }
    const rsv = hh===ll ? 50 : (b[i].c-ll)/(hh-ll)*100; k = 2/3*k + rsv/3; d = 2/3*d + k/3; K.push(k); D.push(d); J.push(3*k-2*d); }
  return {k:K, d:D, j:J};
}
function bollOf(c, n=20, m=2){
  const mid = sma(c,n), up = new Array(c.length).fill(null), lo = new Array(c.length).fill(null);
  for (let i=n-1;i<c.length;i++){ let s=0; for (let j=i-n+1;j<=i;j++) s += (c[j]-mid[i])**2; const sdv = Math.sqrt(s/n); up[i]=mid[i]+m*sdv; lo[i]=mid[i]-m*sdv; }
  return {mid, up, lo};
}
function atrOf(b, n=14){ let a=null; const o=[]; for (let i=0;i<b.length;i++){ const pc = i ? b[i-1].c : b[i].o; const tr = Math.max(b[i].h-b[i].l, Math.abs(b[i].h-pc), Math.abs(b[i].l-pc)); a = a===null ? tr : (a*(n-1)+tr)/n; o.push(a); } return o; }
function weekKey(t){ const d = Date.parse(t+'T00:00:00Z'); const wd = (new Date(d).getUTCDay()+6)%7; return new Date(d - wd*DAY).toISOString().slice(0,10); }
function aggregate(bars, tf){
  if (tf==='day') return bars;
  const out = []; let cur = null, key = null;
  for (const b of bars){
    const k = tf==='week' ? (b.wk || (b.wk = weekKey(b.t))) : b.t.slice(0,7);
    if (k!==key){ if (cur) out.push(cur); cur = {t:b.t, o:b.o, h:b.h, l:b.l, c:b.c, v:b.v}; key = k; }
    else { cur.t=b.t; if (b.h>cur.h) cur.h=b.h; if (b.l<cur.l) cur.l=b.l; cur.c=b.c; cur.v+=b.v; }
  }

}
function indicators(bars, ma){
  const c = bars.map(b=>b.c), v = bars.map(b=>b.v);
  return {ma: ma.map(n=>sma(c,n)), boll: bollOf(c), macd: macdOf(c), kdj: kdjOf(bars), rsi: [6,12,24].map(n=>rsiOf(c,n)), vma: [sma(v,5), sma(v,10)]};
}

/* ===================== Preliminary analysis ===================== */
function analyze(u){
  const b = HIST[u.s].bars, n = b.length, c = b.map(x=>x.c), last = c[n-1], q = Q[u.s];
  const m5=sma(c,5)[n-1], m10=sma(c,10)[n-1], m20=sma(c,20)[n-1], m60=sma(c,60)[n-1];
  const sig = [];
  // trend
  let ts = 0;
  if (m5>m10 && m10>m20 && m20>m60) ts = 2; else if (m5<m10 && m10<m20 && m20<m60) ts = -2;
  else if (last>m20 && m20>m60) ts = 1; else if (last<m20 && m20<m60) ts = -1;
  sig.push({k:'trend', s:ts, d:{m20, m60, last}});
  // MACD
  const {dif, dea} = macdOf(c); let cross = 0, ago = 0;
  for (let i=n-1;i>=Math.max(1,n-6);i--){ const a=dif[i]-dea[i], p=dif[i-1]-dea[i-1]; if (a>0 && p<=0){ cross=1; ago=n-1-i; break; } if (a<0 && p>=0){ cross=-1; ago=n-1-i; break; } }
  const ms = cross ? 2*cross : (dif[n-1]>dea[n-1] ? 1 : -1);
  sig.push({k:'macd', s:ms, d:{cross, ago, above:dif[n-1]>0, dif:dif[n-1], dea:dea[n-1]}});
  // RSI
  const r14 = rsiOf(c,14)[n-1];
  const rs = r14>80?-2 : r14>70?-1 : r14<20?2 : r14<30?1 : r14>=55?1 : r14<=45?-1 : 0;
  sig.push({k:'rsi', s:rs, d:{r:r14}});
  // KDJ
  const kd = kdjOf(b), K=kd.k[n-1], D=kd.d[n-1], J=kd.j[n-1];
  const ks = J>100?-1 : J<0?1 : K>D?1 : -1;
  sig.push({k:'kdj', s:ks, d:{K, D, J}});
  // Bollinger
  const bo = bollOf(c), up=bo.up[n-1], lo=bo.lo[n-1], pb = (last-lo)/((up-lo)||1);
  let bw = [], squeeze = false; for (let i=n-120;i<n;i++) if (i>=19) bw.push((bo.up[i]-bo.lo[i])/bo.mid[i]);
  squeeze = bw.length>20 && bw[bw.length-1] <= Math.min(...bw.slice(0,-1))*1.04;
  const bs = pb>1?-1 : pb<0?1 : pb>=.5?1 : -1;
  sig.push({k:'boll', s:bs, d:{pb, squeeze, up, lo}});
  // Volume
  let va = 0; for (let i=n-6;i<n-1;i++) va += b[i].v; va /= 5;
  const vr = b[n-1].v/(va||1), dayUp = last >= b[n-2].c;
  // scale today's partial volume to a full-session estimate
  const frac = HIST[u.s].pts.length/MKT[u.m].len, vrAdj = vr/Math.max(.15, frac);
  const vs = vrAdj>1.3 ? (dayUp?1:-1) : 0;
  sig.push({k:'vol', s:vs, d:{vr:vrAdj, dayUp}});
  // Momentum
  const r20 = last/c[n-21]-1, r60 = last/c[n-61]-1;
  const mo = r20>.05?1 : r20<-.05?-1 : 0;
  sig.push({k:'mom', s:mo, d:{r20, r60}});
  // Volatility (info)
  const lr = []; for (let i=n-250;i<n;i++) lr.push(Math.log(c[i]/c[i-1]));
  const sdv = a => { const m=a.reduce((s,x)=>s+x,0)/a.length; return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))*Math.sqrt(252); };
  const v20 = sdv(lr.slice(-20)), v250 = sdv(lr), atr = atrOf(b)[n-1]/last;
  const total = sig.reduce((s,x)=>s+x.s,0), norm = clamp(total/8,-1,1);
  const rating = norm>=.5?'r_sb' : norm>=.15?'r_b' : norm>-.15?'r_n' : norm>-.5?'r_s' : 'r_ss';
  // levels
  let h20=-Infinity,l20=Infinity,h60=-Infinity,l60=Infinity;
  for (let i=n-60;i<n;i++){ const x=b[i]; if (i>=n-20){ if (x.h>h20) h20=x.h; if (x.l<l20) l20=x.l; } if (x.h>h60) h60=x.h; if (x.l<l60) l60=x.l; }
  return {sig, total, norm, rating, v20, v250, atr, levels:{h20,l20,h60,l60,last}, m:{m5,m10,m20,m60,r14,K,D,J,pb,dif:dif[n-1],dea:dea[n-1]}, q};
}

/* ===================== Fund metrics ===================== */
function fundMetrics(f){
  const h = FH[f.id], v = h.vals.slice(), n = v.length;
  if (f.kind==='mf') { /* official series only */ }
  const last = v[n-1], ret = k => n>k ? last/v[n-1-k]-1 : null;
  const yr = h.dates[n-1].slice(0,4); let yi = 0; for (let i=n-1;i>=0;i--) if (h.dates[i].slice(0,4)<yr){ yi=i; break; }
  const R = {w1:ret(5), m1:ret(21), m3:ret(63), m6:ret(126), ytd:last/v[yi]-1, y1:ret(252), y3:ret(756), all:last/v[0]-1};
  const lr = []; for (let i=n-252;i<n;i++) lr.push(Math.log(v[i]/v[i-1]));
  const mean = lr.reduce((s,x)=>s+x,0)/lr.length, vol = Math.sqrt(lr.reduce((s,x)=>s+(x-mean)**2,0)/(lr.length-1))*Math.sqrt(252);
  let peak=-Infinity, mdd=0; for (let i=n-253;i<n;i++){ if (v[i]>peak) peak=v[i]; mdd = Math.min(mdd, v[i]/peak-1); }
  const rf = MKT[f.m].rf, sharpe = (R.y1-rf)/(vol||1);
  let beta=null, alpha=null, B=null;
  if (f.bench){
    const bb = HIST[f.bench].bars, bc = bb.slice(0,n).map(x=>x.c);
    const rb = []; for (let i=n-252;i<n;i++) rb.push(Math.log(bc[i]/bc[i-1]));
    const mb = rb.reduce((s,x)=>s+x,0)/rb.length; let cov=0, vb=0; for (let i=0;i<rb.length;i++){ cov += (lr[i]-mean)*(rb[i]-mb); vb += (rb[i]-mb)**2; }
    beta = cov/(vb||1); alpha = (mean - beta*mb)*252;
    const lastB = bc[n-1], rB = k => n>k ? lastB/bc[n-1-k]-1 : null;
    B = {w1:rB(5), m1:rB(21), m3:rB(63), m6:rB(126), ytd:lastB/bc[yi]-1, y1:rB(252), y3:rB(756), all:lastB/bc[0]-1};
  }
  const me = []; let lm = null; for (let i=0;i<n;i++){ const mk = h.dates[i].slice(0,7); if (mk!==lm){ me.push(i? v[i-1] : v[0]); lm = mk; } } me.push(last);
  const mr = []; for (let i=Math.max(1, me.length-36); i<me.length; i++) mr.push(me[i]/me[i-1]-1);
  const win = mr.filter(x=>x>0).length/(mr.length||1);
  const ann3 = R.y3!=null ? Math.pow(1+R.y3, 1/3)-1 : null;
  const stars = sharpe<0?1 : sharpe<.4?2 : sharpe<.8?3 : sharpe<1.2?4 : 5;
  return {R, B, vol, mdd, sharpe, beta, alpha, win, ann3, stars};
}
function fundClass(f){ return (f.type==='bond' || f.type==='commodity') ? 'def' : 'eq'; }
function fundRank(f){
  const peers = FUNDS.filter(x=>fundClass(x)===fundClass(f)).map(x=>({id:x.id, r:fundMetrics(x).R.y1})).sort((a,b)=>b.r-a.r);
  return {rank: peers.findIndex(x=>x.id===f.id)+1, of: peers.length};
}
function dcaSim(f, amount, freq, years){
  const h = FH[f.id], v = h.vals, n = v.length, step = freq==='weekly' ? 5 : 21, span = Math.min(n-1, Math.round(years*252));
  const start = n-1-span; let units = 0, inv = 0; const curve = [];
  for (let i=start, j=0; i<n; i++){
    if ((i-start)%step===0){ units += amount/v[i]; inv += amount; j++; }
    curve.push({i, inv, val: units*v[i]});
  }
  const val = units*v[n-1], lump = v[n-1]/v[start]-1;
  return {inv, val, profit: val-inv, ret: val/inv-1, lump, count: Math.round(inv/amount), curve};
}

/* ===================== Formatting ===================== */
let LANG = 'en';
const NF = {};
function nf(d){ const k = LANG+d; return NF[k] || (NF[k] = new Intl.NumberFormat(LANG==='zh'?'zh-CN':'en-US',{minimumFractionDigits:d, maximumFractionDigits:d})); }
function fmt(x, d=2){ return (x==null || !isFinite(x)) ? '–' : nf(d).format(x); }
function fmtPct(x, d=2, sign=true){ if (x==null || !isFinite(x)) return '–'; if (Math.abs(x) < .5*Math.pow(10,-d-2)) x = 0; const s = x>0 && sign ? '+' : ''; return s + nf(d).format(x*100) + '%'; }
function fmtSigned(x, d=2){ if (x==null || !isFinite(x)) return '–'; if (Math.abs(x) < .5*Math.pow(10,-d)) x = 0; return (x>0?'+':'') + nf(d).format(x); }
function fmtBig(x, d=2){
  if (x==null || !isFinite(x)) return '–'; const a = Math.abs(x);
  if (LANG==='zh'){ if (a>=1e12) return fmt(x/1e12,d)+'万亿'; if (a>=1e8) return fmt(x/1e8,d)+'亿'; if (a>=1e4) return fmt(x/1e4,d)+'万'; return fmt(x,0); }
  if (a>=1e12) return fmt(x/1e12,d)+'T'; if (a>=1e9) return fmt(x/1e9,d)+'B'; if (a>=1e6) return fmt(x/1e6,d)+'M'; if (a>=1e3) return fmt(x/1e3,d)+'K'; return fmt(x,0);
}
function fmtDur(mins){
  const m = Math.max(0, Math.round(mins)), d = Math.floor(m/1440), h = Math.floor(m%1440/60), mi = m%60;
  if (LANG==='zh') return d ? `${d}天${h}小时` : h ? `${h}小时${mi}分` : `${mi}分钟`;
  return d ? `${d}d ${h}h` : h ? `${h}h ${mi}m` : `${mi}m`;
}
function decOf(u, x){ return u.kind==='index' ? 2 : (x<1 ? 3 : 2); }
function fundDec(f, x){ return f.kind==='mf' ? 4 : (x<10 ? 3 : 2); }
const dirCls = x => x>5e-5 ? 'up' : x<-5e-5 ? 'dn' : 'flat';

function niceStep(range, n){ const raw = range/Math.max(1,n), p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p; return (m<1.5?1 : m<2.25?2 : m<3.5?2.5 : m<7.5?5 : 10)*p; }

function rrect(ctx, x, y, w, h, r){ r = Math.min(r, w/2, h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

class BaseCanvas {
  constructor(host){
    this.host = host; this.cv = document.createElement('canvas'); host.appendChild(this.cv);
    this.cv.setAttribute('tabindex','0'); this.ctx = this.cv.getContext('2d');
    this.w = 0; this.h = 0; this.dpr = 1; this.raf = 0; this.hi = null; this.hy = null; this.pinned = false; this.onHover = null;
    new ResizeObserver(()=>this.resize()).observe(host);
  }
  resize(){
    const r = this.host.getBoundingClientRect(), w = Math.round(r.width), h = Math.round(r.height);
    if (!w || !h) return;
    const dpr = Math.min(window.devicePixelRatio||1, 2.5);
    if (w===this.w && h===this.h && dpr===this.dpr) return;
    const first = !this.w; this.w = w; this.h = h; this.dpr = dpr;
    this.cv.width = Math.round(w*dpr); this.cv.height = Math.round(h*dpr);
    this.cv.style.width = w+'px'; this.cv.style.height = h+'px';
    if (first && this.firstSize) this.firstSize();
    this.draw();

function dispMap(w, h, r, b){
  let sc = 1; if (w*h > 160000) sc = Math.sqrt(160000/(w*h));
  const W = Math.max(2, Math.round(w*sc)), Hh = Math.max(2, Math.round(h*sc)), R = r*sc, B = Math.max(2, b*sc);

    if (qx>0 && qy>0){ const dc = Math.hypot(qx,qy)||1; d = R-dc; nx = qx/dc*Math.sign(X); ny = qy/dc*Math.sign(Y); }

function sigInfo(sg){
  const zh = LANG==='zh', d = sg.d;
  switch (sg.k){
    case 'trend': return {n:zh?'趋势':'Trend', p:({'2':zh?'MA5 > MA10 > MA20 > MA60，均线多头排列。':'MA5 > MA10 > MA20 > MA60, a bullish stack.', '-2':zh?'MA5 < MA10 < MA20 < MA60，均线空头排列。':'MA5 < MA10 < MA20 < MA60, a bearish stack.', '1':zh?'股价在MA20上方，MA20高于MA60。':'Price above MA20, and MA20 above MA60.', '-1':zh?'股价在MA20下方，MA20低于MA60。':'Price below MA20, and MA20 below MA60.', '0':zh?'股价围绕均线震荡，趋势不明。':'Price is weaving around its averages.'})[String(sg.s)]};
    case 'macd': { let p; if (d.cross){ const w = d.ago===0 ? (zh?'今日':'today') : (zh?`${d.ago}根K线前`:`${d.ago} bar${d.ago>1?'s':''} ago`); p = zh ? `${w}${d.cross>0?'金叉':'死叉'}，位于零轴${d.above?'上方':'下方'}。` : `${d.cross>0?'Golden':'Death'} cross ${w}, ${d.above?'above':'below'} the zero line.`; } else p = d.dif>d.dea ? (zh?'DIF在DEA上方，动能偏强。':'DIF above DEA, momentum improving.') : (zh?'DIF在DEA下方，动能偏弱。':'DIF below DEA, momentum fading.'); return {n:'MACD', p}; }
    case 'rsi': { const r = d.r, l = r>80?(zh?'严重超买':'deeply overbought') : r>70?(zh?'超买':'overbought') : r<20?(zh?'严重超卖':'deeply oversold') : r<30?(zh?'超卖':'oversold') : r>=55?(zh?'动能偏强':'firm momentum') : r<=45?(zh?'动能偏弱':'soft momentum') : (zh?'中性区间':'neutral zone'); return {n:'RSI(14)', p:zh?`读数 ${fmt(r,1)}，${l}。`:`Reading ${fmt(r,1)}, ${l}.`}; }
    case 'kdj': { const tail = d.J>100?(zh?'J值高于100，短线过热。':'J above 100, short-term overheated.') : d.J<0?(zh?'J值低于0，短线超跌。':'J below 0, short-term washed out.') : d.K>d.D?(zh?'K线在D线上方。':'K above D.') : (zh?'K线在D线下方。':'K below D.'); return {n:'KDJ', p:`K ${fmt(d.K,0)}, D ${fmt(d.D,0)}, J ${fmt(d.J,0)}${zh?'，':'. '}${tail}`}; }
    case 'boll': { const pb = fmt(d.pb,2); let p = d.pb>1?(zh?`突破上轨（%B ${pb}），短线偏离较大。`:`Above the upper band (%B ${pb}), stretched.`) : d.pb<0?(zh?`跌破下轨（%B ${pb}），短线超跌。`:`Below the lower band (%B ${pb}), stretched lower.`) : d.pb>=.5?(zh?`运行于中轨上方（%B ${pb}）。`:`Upper half of the band (%B ${pb}).`) : (zh?`运行于中轨下方（%B ${pb}）。`:`Lower half of the band (%B ${pb}).`); if (d.squeeze) p += zh?'带宽处于半年低位，或酝酿方向选择。':' Bands are at a six-month low width, so a breakout may be near.'; return {n:zh?'布林带':'Bollinger', p}; }
    case 'vol': { const vr = fmt(d.vr,2), p = d.vr>1.3 ? (d.dayUp?(zh?`量比 ${vr}，放量上涨。`:`${vr}× the 5-day average on an up day.`):(zh?`量比 ${vr}，放量下跌。`:`${vr}× the 5-day average on a down day.`)) : d.vr<.7 ? (zh?`量比 ${vr}，明显缩量。`:`${vr}× the 5-day average, unusually light.`) : (zh?`量比 ${vr}，量能平稳。`:`${vr}× the 5-day average, about normal.`); return {n:zh?'量能':'Volume', p}; }
    case 'mom': return {n:zh?'动量':'Momentum', p:zh?`近20日 ${fmtPct(d.r20,1)}，近60日 ${fmtPct(d.r60,1)}。`:`${fmtPct(d.r20,1)} over 20 days, ${fmtPct(d.r60,1)} over 60 days.`};
  }
  return {n:sg.k, p:''};
}

function ladderHTML(a, u){
  const L = a.levels, dec = decOf(u, L.last), near = (x,y) => Math.abs(x/y-1) < .002, lv = [];
  lv.push({k:'res', lab:t('r60'), v:L.h60}); if (!near(L.h20, L.h60)) lv.push({k:'res', lab:t('r20'), v:L.h20});
  lv.push({k:'now', lab:t('now'), v:L.last});
  if (!near(L.l20, L.l60)) lv.push({k:'sup', lab:t('s20'), v:L.l20}); lv.push({k:'sup', lab:t('s60'), v:L.l60});
  const hi = Math.max(...lv.map(x=>x.v)), lo = Math.min(...lv.map(x=>x.v));
  const ord = lv.map((x,i)=>[10+(hi-x.v)/((hi-lo)||1)*80, i]).sort((p,q)=>p[0]-q[0]);
  for (let j=1;j<ord.length;j++) if (ord[j][0]-ord[j-1][0] < 15) ord[j][0] = ord[j-1][0]+15;
  const over = ord[ord.length-1][0]-91; if (over>0) for (const o of ord) o[0] -= over;
  const ys = []; for (const [y,i] of ord) ys[i] = Math.max(8, y);
  return `<div class="ladder">${lv.map((x,i)=>`<div class="lv ${x.k}" style="top:${ys[i].toFixed(1)}%"><span>${x.lab}</span><b>${fmt(x.v,dec)}</b><em>${x.k==='now'?'':fmtPct(x.v/L.last-1,1)}</em></div>`).join('')}</div>`;
}

    s += lv(`股价正在测试20日高点 ${fmt(L.h20,dec)}，下方支撑看20日低点 ${fmt(L.l20,dec)}。`, `股价正在测试20日低点 ${fmt(L.l20,dec)}，上方压力看20日高点 ${fmt(L.h20,dec)}。`, `下方支撑约 ${fmt(L.l20,dec)}（${fmtPct(L.l20/L.last-1,1)}），上方压力约 ${fmt(L.h20,dec)}（${fmtPct(L.h20/L.last-1,1)}）。`);

const TRADES = {};
const tickSize = (u, p) => u.m==='HK' ? hkTick(p) : .01;
const lotOf = u => u.m==='CN' ? 100 : u.m==='HK' ? (u.lot||100) : 1;
function tradeSize(u){ const q = Q[u.s], lot = lotOf(u), base = Math.max(lot, q.vol/MKT[u.m].len/40); return Math.max(lot, Math.round(base*(.3+LIVE.u()*2)/lot)*lot); }
function seedTrades(u){ const q = Q[u.s], tk = tickSize(u, q.price), out = []; let ts = Date.now(); for (let i=0;i<14;i++){ ts -= 2000+LIVE.u()*7000; out.push({ts, p:roundPrice(u, q.price+Math.round(LIVE.n()*1.4)*tk), v:tradeSize(u), side:LIVE.u()>.5?'B':'S'}); } return out; }
function pushTrade(){ const u = UBY[S.sel]; if (!u || u.kind==='index') return; const q = Q[u.s], arr = TRADES[u.s] || (TRADES[u.s] = seedTrades(u)); arr.unshift({ts:Date.now(), p:q.price, v:tradeSize(u), side:q.dir>=0?'B':'S'}); if (arr.length>16) arr.length = 16; }
function breadthHTML(m){

function renderBook(){
  if (S.side!=='book') return;
  const pane = $('#bookPane'), u = UBY[S.sel], q = Q[u.s];
  if (u.kind==='index'){ pane.innerHTML = breadthHTML(u.m); return; }

  const sz = () => Math.max(lot, Math.round(base*(.25+LIVE.u()*1.8)/lot)*lot), asks = [], bids = [];

function drawWall(force){

  if (!force && key===wallKey) return; wallKey = key;
  const back = $(wallFront==='A' ? '#wallB' : '#wallA'), front = $(wallFront==='A' ? '#wallA' : '#wallB');
  paintWall(back, sym); back.classList.add('on'); front.classList.remove('on'); wallFront = wallFront==='A' ? 'B' : 'A';

function paintWall(cv, sym){
  const W = innerWidth+140, H = innerHeight+140, sc = .5, dark = isDark(), C = cssColors();
  cv.width = Math.round(W*sc); cv.height = Math.round(H*sc);
  const ctx = cv.getContext('2d'); ctx.setTransform(sc,0,0,sc,0,0);
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0, dark ? '#0C172B' : '#EEF2F8'); g.addColorStop(1, dark ? '#08101E' : '#DCE4EF'); ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const bars = HIST[sym].bars.slice(-54), n = bars.length; let hi = -Infinity, lo = Infinity; for (const b of bars){ if (b.h>hi) hi=b.h; if (b.l<lo) lo=b.l; }
  const top = H*.12, bot = H*.96, y = v => bot-(v-lo)/((hi-lo)||1)*(bot-top), slot = W/n, base = dark ? .9 : .62;
  for (let i=0;i<n;i++){ const b = bars[i], x = (i+.5)*slot, bw = slot*.58, yt = Math.min(y(b.o),y(b.c)), yb = Math.max(y(b.o),y(b.c));
    ctx.fillStyle = b.c>=b.o ? C.up : C.down;
    ctx.globalAlpha = base*.45; ctx.fillRect(x-slot*.07, y(b.h), slot*.14, Math.max(2, y(b.l)-y(b.h)));
    ctx.globalAlpha = base; rrect(ctx, x-bw/2, yt, bw, Math.max(bw*.7, yb-yt), bw/2); ctx.fill(); }
  ctx.globalAlpha = dark ? .7 : .55; ctx.strokeStyle = C.accent; ctx.lineWidth = slot*.45; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const ma = sma(HIST[sym].bars.map(b=>b.c), 10).slice(-n); ctx.beginPath(); ma.forEach((v,i)=>{ const X = (i+.5)*slot, Y = y(v); i ? ctx.lineTo(X,Y) : ctx.moveTo(X,Y); }); ctx.stroke();
  ctx.globalAlpha = 1;
  const veil = ctx.createLinearGradient(0,0,0,H); veil.addColorStop(0, dark ? 'rgba(8,16,30,.45)' : 'rgba(255,255,255,.45)'); veil.addColorStop(.3, 'rgba(0,0,0,0)'); ctx.fillStyle = veil; ctx.fillRect(0,0,W,H);
}

let srIdx = 0, srList = [];
function searchItems(q){
  q = q.trim().toLowerCase(); if (!q) return [];
  const score = fs => { let b = 0; for (const [f, w] of fs){ if (!f) continue; const s = f.toLowerCase(); if (s===q) b = Math.max(b, 100*w); else if (s.startsWith(q)) b = Math.max(b, 70*w); else if (s.includes(q)) b = Math.max(b, 40*w); } return b; };
  const res = [];
  for (const u of U){ const sc = score([[u.s,1.2],[code(u.s),1.2],[u.en,1],[u.zh,1],[u.py,1.1]]); if (sc) res.push({type:'u', o:u, sc}); }
  for (const f of FUNDS){ const sc = score([[f.id,1.2],[fcode(f),1.2],[f.en,1],[f.zh,1],[f.py,1]]); if (sc) res.push({type:'f', o:f, sc:sc*.95}); }
  return res.sort((a,b)=>b.sc-a.sc).slice(0,10);
}

}
function bindEvents(){
  $('#mainTabs').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
  $('#tabbar').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.act==='settings') openSheet(); else setView(b.dataset.view); });
  $('#brand').addEventListener('click', e => { e.preventDefault(); setView('watch'); });
  $('#feedBtn').addEventListener('click', () => { setSetting('feed', !S.set.feed); toast(t(S.set.feed?'feed_on':'feed_off')); });
  $('#themeBtn').addEventListener('click', () => setSetting('theme', isDark() ? 'light' : 'dark'));
  $('#langBtn').addEventListener('click', () => setSetting('lang', LANG==='zh' ? 'en' : 'zh'));
  $('#settingsBtn').addEventListener('click', openSheet);
  $('#ticker').addEventListener('click', e => { const b = e.target.closest('[data-sym]'); if (b){ if (S.view!=='watch') setView('watch'); selectStock(b.dataset.sym); } });
  $('#wlFilter').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; S.wf = b.dataset.f; if (S.wf!=='watch') S.editing = false; syncFilter(); renderWatchList(); });
  $('#wlEdit').addEventListener('click', () => { S.editing = !S.editing; if (S.editing) S.sort = 'default'; renderWatchList(); });
  $('#wlSort').addEventListener('click', () => { S.sort = {default:'gain', gain:'loss', loss:'default'}[S.sort]; renderWatchList(); });
  const rows = $('#wlRows');
  rows.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a){ e.stopPropagation(); toggleWatch(a.dataset.s); return; } const r = e.target.closest('.row'); if (r && !S.editing) selectStock(r.dataset.sym); });
  rows.addEventListener('pointerdown', e => { const g = e.target.closest('[data-grip]'); if (g && S.editing) startDrag(e, g); });
  $('#stockDetail').addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a) return; const act = a.dataset.act; if (act==='back') $('#viewWatch').classList.remove('show-detail'); else if (act==='star') toggleWatch(S.sel); else if (act==='alert'){ if ($('#popover').hidden) openAlertPop(a); else closePopover(); } });
  $('#tfSeg').addEventListener('click', e => { const b = e.target.closest('[data-tf]'); if (!b) return; S.set.tf = b.dataset.tf; persist(); renderChartTools(); syncSeg($('#tfSeg'), true); updateChart(false); renderChartInfo(null); });
  $('#mainSeg').addEventListener('click', e => { const b = e.target.closest('[data-main]'); if (b){ setSetting('main', b.dataset.main); syncSeg($('#mainSeg'), true); } });
  $('#subSeg').addEventListener('click', e => { const b = e.target.closest('[data-sub]'); if (b){ setSetting('sub', b.dataset.sub); syncSeg($('#subSeg'), true); } });
  $('#chartReset').addEventListener('click', () => K.resetView());
  $('#chartExpand').addEventListener('click', () => toggleExpand());
  $('#sideSeg').addEventListener('click', e => { const b = e.target.closest('[data-side]'); if (b) setSide(b.dataset.side); });
  $('#stockSide').addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a){ if (a.dataset.act==='ai') askAI('stock'); else if (a.dataset.act==='ai-stop' && aiCtl) aiCtl.abort(); return; } const r = e.target.closest('[data-sym]'); if (r) selectStock(r.dataset.sym); });
  $('#viewMarkets').addEventListener('click', e => {
    const h = e.target.closest('[data-heat]'); if (h){ S.heat = h.dataset.heat; pressSeg($('#heatSeg'), h); renderHeat(); drawWall(); return; }
    const mv = e.target.closest('[data-mv]'); if (mv){ S.movers = mv.dataset.mv; pressSeg($('#moverSeg'), mv); renderMovers(); return; }
    const s = e.target.closest('[data-sym]'); if (s){ setView('watch'); selectStock(s.dataset.sym); return; }
    const f = e.target.closest('[data-fund]'); if (f){ setView('funds'); selectFund(f.dataset.fund); }
  });
  $('#flRegion').addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b){ S.fr = b.dataset.r; renderFundList(); } });
  $('#flTypes').addEventListener('click', e => { const b = e.target.closest('[data-ft]'); if (b){ S.ft = b.dataset.ft; renderFundList(); } });
  $('#flSort').addEventListener('click', e => { const b = e.target.closest('[data-fs]'); if (b){ S.fs = b.dataset.fs; renderFundList(); } });
  $('#flRows').addEventListener('click', e => { const r = e.target.closest('[data-fund]'); if (r) selectFund(r.dataset.fund); });
  $('#fundDetail').addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (a){ if (a.dataset.act==='back') $('#viewFunds').classList.remove('show-detail'); else if (a.dataset.act==='fstar') toggleFund(S.fsel); return; }
    const rg = e.target.closest('[data-range]'); if (rg){ S.range = rg.dataset.range; pressSeg($('#rangeSeg'), rg); updateNav(false); return; }
    const s = e.target.closest('[data-sym]'); if (s){ setView('watch'); selectStock(s.dataset.sym); }
  });
  $('#benchBtn').addEventListener('click', () => { S.bench = !S.bench; $('#benchBtn').setAttribute('aria-pressed', S.bench); updateNav(false); });
  $('#fundSide').addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (a){ if (a.dataset.act==='ai') askAI('fund'); else if (a.dataset.act==='ai-stop' && aiCtl) aiCtl.abort(); return; }
    const fr = e.target.closest('[data-freq]'); if (fr){ S.dca.freq = fr.dataset.freq; renderDCA(); return; }
    const yr = e.target.closest('[data-yrs]'); if (yr){ S.dca.yrs = +yr.dataset.yrs; renderDCA(); }
  });
  $('#fundSide').addEventListener('input', e => { if (e.target.id==='dcaAmt'){ const v = parseFloat(e.target.value); if (v>0 && v<1e9){ S.dca.amt = v; renderDCA(); } } });
  const si = $('#searchInput');
  si.addEventListener('input', () => renderSearch()); si.addEventListener('focus', () => { if (si.value.trim()) renderSearch(true); }); si.addEventListener('keydown', searchKeys);
  $('#searchPop').addEventListener('pointerdown', e => e.preventDefault());
  $('#searchPop').addEventListener('click', e => { const st = e.target.closest('[data-act="sr-star"]'); if (st){ const r = srList[+st.dataset.i]; if (r.type==='u') toggleWatch(r.o.s); else toggleFund(r.o.id); return; } const it = e.target.closest('.sr-item'); if (it) openResult(+it.dataset.i); });
  $('#sheetBody').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const seg = b.closest('[data-set]');
    if (seg && b.dataset.v!=null){ const k = seg.dataset.set; pressSeg(seg, b); setSetting(k, b.dataset.v); return; }
    if (b.dataset.sw){ const k = b.dataset.sw, v = !S.set[k]; b.setAttribute('aria-checked', v); setSetting(k, v); return; }
    if (b.dataset.wall){ $$('#sheetBody .sw').forEach(x=>x.setAttribute('aria-pressed', x===b)); setSetting('wall', b.dataset.wall); return; }
    if (b.dataset.act==='reset-watch'){ S.watch = DEFAULT_WATCH.slice(); S.fwatch = DEFAULT_FWATCH.slice(); S.editing = false; persist(); renderWatchList(); renderFundList(); renderDetailHead(); toast(t('reset_done')); }
    if (b.dataset.act==='reset-all') resetAll();
  });
  $('#sheetBody').addEventListener('input', e => { const r = e.target.closest('[data-range]'); if (r){ rangeFill(r); setSetting(r.dataset.range, +r.value, true); } });
  $('#sheetBody').addEventListener('change', e => { if (e.target.closest('[data-range]')) persist(); if (e.target.closest('[data-ma]')) setMA(); });
  $('#scrim').addEventListener('click', closeSheet);
  $('#sheet').addEventListener('click', e => { if (e.target.closest('[data-act="close-sheet"]')) closeSheet(); });
  $('#popover').addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a) return; if (a.dataset.act==='alert-add') addAlert(); if (a.dataset.act==='alert-rm'){ S.alerts.splice(+a.dataset.i, 1); persist(); renderAlertPop(); renderDetailHead(); renderWatchList(); } });
  $('#popover').addEventListener('keydown', e => { if (e.key==='Enter' && e.target.id==='alertIn'){ e.preventDefault(); addAlert(); } });
  document.addEventListener('pointerdown', e => {
    if (!$('#searchBox').contains(e.target)) closeSearch();
    const pop = $('#popover'); if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('[data-act="alert"]')) closePopover();
  }, true);
  document.addEventListener('keydown', e => {
    const tg = e.target, typing = tg && (tg.tagName==='INPUT' || tg.tagName==='TEXTAREA' || tg.isContentEditable);
    if (e.key==='/' && !typing){ e.preventDefault(); $('#searchInput').focus(); return; }
    if (e.key==='Escape'){ closePopover(); if (!$('#sheet').hidden) closeSheet(); else if ($('#chartCard').classList.contains('expanded')) toggleExpand(false); return; }
    if (!typing && (e.key==='Enter' || e.key===' ') && tg && tg.getAttribute && tg.getAttribute('role')==='button' && tg.tagName!=='BUTTON'){ e.preventDefault(); tg.click(); return; }
    if (!typing && S.view==='watch' && (e.key==='ArrowDown' || e.key==='ArrowUp') && !(tg && tg.closest && tg.closest('.chart-host, .sheet, .popover, .search'))){ e.preventDefault(); moveSel(e.key==='ArrowDown'?1:-1); }
  });
  document.addEventListener('pointermove', specular, {passive:true});
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { syncAllSegs(); if (S.view==='markets') renderHeat(); drawWall(); }, 140); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.set.theme==='auto'){ updateThemeBtn(); redrawCharts(); drawWall(true); } });
}

/* ===================== Boot ===================== */
function boot(){
  const local = loadLocal(); if (local) applyPersist(local);
  if (!S.set.lang) S.set.lang = detectLang();
  if (!S.set.colors) S.set.colors = S.set.lang==='zh' ? 'cn' : 'us';
  LANG = S.set.lang;
  if (canRefract()) document.documentElement.classList.add('can-refract');
  buildAll();
  for (const m in MKT) TIMES[m] = Array.from({length:MKT[m].len}, (_,i)=>hhmm(idxToMin(m,i)));
  K = new KChart($('#kHost')); NC = new LineChart($('#navHost'));
  K.onHover = renderChartInfo; NC.onHover = renderNavInfo;
  $$('.liquid').forEach(lgObserve);
  applySettings(); applyI18n(); bindEvents();
  renderTicker(); syncFilter(); renderWatchList(); selectStock(S.sel, true); setSide(S.side);
  renderFundList(); renderFund(); renderFundSide();
  setView('watch');
  const panels = $$('.panel'); panels.forEach((p,i)=>p.style.transitionDelay = Math.min(i,8)*60+'ms');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ $('#app').classList.remove('booting'); setTimeout(()=>panels.forEach(p=>p.style.transitionDelay=''), 1600); }));
  startFeed(); setInterval(clockTick, 1000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ syncAllSegs(); redrawCharts(); });
  Remote.init(); initSample(); updateSaveState();
}
boot();

</script>
